baseURL = "https://www.sevir.org/"
title = "Dr. SeViR"
theme = "manga-lab"
defaultContentLanguage = "es"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
summaryLength = 40
capitalizeListTitles = false

[pagination]
  pagerSize = 9

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

# ── Idiomas ───────────────────────────────────────────────────
# Las etiquetas del menú se traducen por `identifier` en i18n/*.yaml.
[languages]
  [languages.es]
    languageName = "Español"
    languageCode = "es-ES"
    weight = 1
    contentDir = "content/es"
    [[languages.es.menus.main]]
      identifier = "lab"
      pageRef = "/laboratorio"
      weight = 1
    [[languages.es.menus.main]]
      identifier = "story"
      url = "/#historia"
      weight = 2
    [[languages.es.menus.main]]
      identifier = "blog"
      pageRef = "/blog"
      weight = 3
    [[languages.es.menus.main]]
      identifier = "about"
      pageRef = "/sobre-mi"
      weight = 4

  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
    contentDir = "content/en"
    [[languages.en.menus.main]]
      identifier = "lab"
      pageRef = "/lab"
      weight = 1
    [[languages.en.menus.main]]
      identifier = "story"
      url = "/en/#historia"
      weight = 2
    [[languages.en.menus.main]]
      identifier = "blog"
      pageRef = "/blog"
      weight = 3
    [[languages.en.menus.main]]
      identifier = "about"
      pageRef = "/about"
      weight = 4

# ── Parámetros del sitio ──────────────────────────────────────
[params]
  author = "José Francisco Rives Lirola"
  handle = "SeViR"
  ogImage = "images/og-default.jpg"
  familyImage = "images/familia-laboratorio.webp"
  familyImageFallback = "images/familia-laboratorio-1200.jpg"

  [params.social]
    github = "https://github.com/sevir"
    githubOrg = "https://github.com/digiogithub"
    linkedin = "https://www.linkedin.com/in/sevir/"
    company = "https://www.digio.es"

[markup]
  [markup.highlight]
    noClasses = true
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
