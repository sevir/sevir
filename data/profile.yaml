# Ficha de personaje (capítulo 1) y frases al pulsar sobre los personajes.
card:
  name: "José Francisco Rives Lirola"
  alias: "SeViR"
  job: { es: "Inventor · CTO en DIGIO", en: "Inventor · CTO at DIGIO" }
  base: { es: "Murcia, España", en: "Murcia, Spain" }
  power: { es: "Convertir ideas raras en software que funciona", en: "Turning odd ideas into working software" }
  weak: { es: "Empezar otro proyecto antes de acabar el anterior", en: "Starting a new project before finishing the last one" }

intro:
  es:
    - "Soy inventor de software y CTO en DIGIO, un estudio de producto digital de Murcia."
    - "Llevo más de 20 años construyendo y manteniendo una plataforma SaaS que diseñé desde la primera línea. Ahora paso los días entre Rust, Go y TypeScript, creando agentes de IA, servidores MCP y herramientas para que mi equipo programe mejor."
    - "Antes fui administrador de sistemas en ratos libres, manitas en casa y monitor de patinaje. Algunas cosas no han cambiado."
  en:
    - "I'm a software inventor and CTO at DIGIO, a digital product studio in Murcia, Spain."
    - "For more than 20 years I've been building and running a SaaS platform I designed from the very first line. These days I live between Rust, Go and TypeScript, building AI agents, MCP servers and tools so my team can write better software."
    - "Before that I was a part-time sysadmin, a handyman at home and a skating instructor. Some things never change."

