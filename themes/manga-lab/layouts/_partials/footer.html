<footer class="footer">
  <div class="wrap footer__in">
    <p class="footer__page" aria-hidden="true">— {{ now.Format "06" }} —</p>
    <p class="footer__made">{{ T "footer_made" }} © {{ now.Year }} {{ site.Params.author }}</p>
    <p class="footer__links">
      {{- with site.Params.social }}
      <a href="{{ .github }}" rel="me">GitHub</a>
      <a href="{{ .githubOrg }}">DIGIO @ GitHub</a>
      <a href="{{ .linkedin }}" rel="me">LinkedIn</a>
      {{- end }}
      {{- with site.Home.OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}">{{ T "footer_rss" }}</a>{{ end }}
    </p>
  </div>
</footer>
