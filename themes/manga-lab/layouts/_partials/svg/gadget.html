{{- /* Iconos de inventos. Uso: partial "svg/gadget.html" "agent". viewBox 0 0 120 120. */ -}}
{{- $k := . -}}
<svg class="gadget" viewBox="0 0 120 120" aria-hidden="true">
  <circle cx="60" cy="60" r="52" class="gadget__bg"/>
  {{- if eq $k "agent" }}
    <path d="M60 18 v14" class="g-ln"/><circle cx="60" cy="16" r="6" class="g-acc blink-light"/>
    <rect x="28" y="32" width="64" height="52" rx="14" class="g-fill"/>
    <rect x="38" y="44" width="44" height="24" rx="8" class="g-dark"/>
    <circle cx="50" cy="56" r="5" class="g-eye"/><circle cx="70" cy="56" r="5" class="g-eye"/>
    <path d="M18 54 h10 M92 54 h10" class="g-ln"/>
    <path d="M38 96 h44 l-6 -12 h-32 Z" class="g-fill"/>
    <text x="60" y="80" text-anchor="middle" class="g-txt">&gt;_</text>
  {{- else if eq $k "brain" }}
    <rect x="30" y="34" width="60" height="64" rx="12" class="g-glass"/>
    <rect x="34" y="26" width="52" height="12" rx="4" class="g-dark"/>
    <path d="M44 72 q-8 -12 4 -20 q2 -12 14 -8 q10 -8 18 4 q12 4 4 18 q2 12 -12 12 q-6 8 -16 2 q-12 2 -12 -8 Z" class="g-pink"/>
    <path d="M52 60 q6 4 2 10 M66 54 q-4 8 4 12 M60 74 v6" class="g-ln g-thin"/>
    <circle cx="44" cy="90" r="3" class="g-bub"/><circle cx="74" cy="88" r="2.4" class="g-bub"/>
  {{- else if eq $k "squad" }}
    <path d="M60 20 v50" class="g-ln"/><path d="M60 22 l26 9 l-26 9 Z" class="g-acc"/>
    {{- range slice 30 60 90 }}
      <circle cx="{{ . }}" cy="78" r="13" class="g-fill"/>
      <path d="M{{ sub . 13 }} 76 a13 13 0 0 1 26 0 Z" class="g-dark"/>
      <circle cx="{{ sub . 4 }}" cy="82" r="2" class="g-dot"/><circle cx="{{ add . 4 }}" cy="82" r="2" class="g-dot"/>
    {{- end }}
  {{- else if eq $k "doc" }}
    <path d="M36 22 h36 l16 16 v62 h-52 Z" class="g-paper"/><path d="M72 22 v16 h16" class="g-ln"/>
    <path d="M46 52 h32 M46 62 h32 M46 72 h24 M46 82 h28" class="g-ln g-thin"/>
    <text x="54" y="46" class="g-txt g-txt--s">#</text>
    <path d="M92 70 l4 -10 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 Z" class="g-acc"/>
  {{- else if eq $k "track" }}
    <rect x="22" y="44" width="56" height="34" rx="4" class="g-fill"/><rect x="66" y="30" width="30" height="48" rx="4" class="g-red"/>
    <rect x="72" y="38" width="18" height="14" class="g-glass"/>
    <rect x="30" y="30" width="12" height="16" class="g-dark"/>
    <circle cx="36" cy="22" r="6" class="g-smoke"/><circle cx="46" cy="14" r="4.5" class="g-smoke"/>
    <circle cx="36" cy="84" r="10" class="g-dark"/><circle cx="62" cy="84" r="10" class="g-dark"/><circle cx="86" cy="84" r="10" class="g-dark"/>
    <path d="M14 98 h92" class="g-ln"/>
  {{- else if eq $k "wand" }}
    <rect x="18" y="30" width="72" height="54" rx="8" class="g-dark"/>
    <path d="M18 42 h72" class="g-ln g-ln--light"/>
    <text x="28" y="70" class="g-txt g-txt--light">$_</text>
    <path d="M70 100 L100 58" class="g-ln g-ln--thick"/>
    <path d="M100 42 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" class="g-acc spin-slow"/>
  {{- else if eq $k "eye" }}
    <path d="M14 60 Q60 14 106 60 Q60 106 14 60 Z" class="g-paper"/>
    <circle cx="60" cy="60" r="20" class="g-blue"/><circle cx="60" cy="60" r="9" class="g-dark"/><circle cx="66" cy="54" r="4" class="g-eye"/>
    <path d="M30 30 l6 8 M60 18 v10 M90 30 l-6 8" class="g-ln"/>
  {{- else if eq $k "bridge" }}
    <rect x="16" y="56" width="40" height="32" class="g-blue"/><path d="M26 56 v32 M36 56 v32 M46 56 v32" class="g-ln g-thin"/>
    <rect x="70" y="36" width="34" height="52" rx="4" class="g-fill"/><rect x="76" y="44" width="22" height="8" class="g-dark"/>
    <path d="M36 50 Q60 14 86 32" class="g-ln g-dash"/><path d="M80 26 l8 6 l-9 4" class="g-ln"/>
  {{- else if eq $k "rocket" }}
    <path d="M60 14 Q86 36 80 78 L40 78 Q34 36 60 14 Z" class="g-fill"/>
    <circle cx="60" cy="46" r="10" class="g-glass"/>
    <path d="M40 60 L24 86 L42 78 Z M80 60 L96 86 L78 78 Z" class="g-red"/>
    <path d="M46 80 L60 106 L74 80 Z" class="g-acc flicker"/>
  {{- else if eq $k "sync" }}
    <path d="M18 34 h22 l6 8 h24 v34 h-52 Z" class="g-acc"/>
    <path d="M50 58 h22 l6 8 h24 v34 h-52 Z" class="g-blue"/>
    <path d="M84 24 a26 26 0 0 1 14 26" class="g-ln"/><path d="M92 46 l6 6 l5 -8" class="g-ln"/>
    <path d="M36 98 a26 26 0 0 1 -14 -26" class="g-ln"/><path d="M28 76 l-6 -6 l-5 8" class="g-ln"/>
  {{- else if eq $k "gear" }}
    <g class="spin-slow" style="transform-origin:60px 60px">
      {{- range seq 0 45 315 }}<rect x="53" y="18" width="14" height="18" transform="rotate({{ . }} 60 60)" class="g-fill"/>{{ end }}
      <circle cx="60" cy="60" r="28" class="g-fill"/><circle cx="60" cy="60" r="10" class="g-dark"/>
    </g>
  {{- else if eq $k "spark" }}
    <path d="M66 12 L30 66 L56 66 L46 108 L92 48 L64 48 Z" class="g-acc"/>
  {{- else if eq $k "phone" }}
    <rect x="36" y="16" width="48" height="88" rx="10" class="g-dark"/><rect x="42" y="28" width="36" height="58" class="g-glass"/>
    <circle cx="60" cy="96" r="4" class="g-eye"/>
    <path d="M90 34 q8 8 0 16 M98 28 q14 14 0 28" class="g-ln"/>
    <path d="M60 46 a8 8 0 0 1 8 8 c0 8 -8 16 -8 16 c0 0 -8 -8 -8 -16 a8 8 0 0 1 8 -8 Z" class="g-red"/>
  {{- else if eq $k "chip" }}
    {{- range slice 38 52 66 80 }}<path d="M{{ . }} 26 v-10 M{{ . }} 94 v10" class="g-ln"/>{{ end }}
    {{- range slice 40 54 68 82 }}<path d="M26 {{ . }} h-10 M94 {{ . }} h10" class="g-ln"/>{{ end }}
    <rect x="26" y="26" width="68" height="68" rx="8" class="g-dark"/>
    <rect x="38" y="38" width="44" height="30" rx="3" class="g-glass"/>
    <path d="M60 46 v10 M53 49 a10 10 0 1 0 14 0" class="g-ln g-thin"/>
    <circle cx="44" cy="80" r="4" class="g-acc blink-light"/>
    <path d="M56 80 h22" class="g-ln g-ln--light"/>
  {{- else if eq $k "truck" }}
    <rect x="12" y="38" width="64" height="44" class="g-fill"/>
    <path d="M76 52 h20 l12 16 v14 h-32 Z" class="g-red"/><rect x="84" y="56" width="12" height="10" class="g-glass"/>
    <circle cx="32" cy="86" r="10" class="g-dark"/><circle cx="90" cy="86" r="10" class="g-dark"/>
    <text x="44" y="66" text-anchor="middle" class="g-txt g-txt--s">OK!</text>
  {{- else }}
    <circle cx="60" cy="60" r="20" class="g-acc"/>
  {{- end }}
</svg>
