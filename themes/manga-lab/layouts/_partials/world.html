{{- /* El mundo del laboratorio: capas SVG independientes (parallax) con viewBox 1600×900.
       Cada capa es un <svg> HTML para que el navegador las componga por GPU.
       Los personajes (vectorizados de la ilustración) van en la capa .family, entre "ground" y "front". */ -}}
{{- $vb := `viewBox="0 0 1600 900" preserveAspectRatio="none"` | safeHTMLAttr -}}

{{- /* ── 1 · CIELO ─────────────────────────────────────────── */}}
<svg class="layer layer--sky" {{ $vb }} aria-hidden="true" style="--d:4">
  <defs>
    <linearGradient id="w-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="sky-top"/><stop offset=".62" class="sky-mid"/><stop offset="1" class="sky-low"/>
    </linearGradient>
    <pattern id="w-dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4.5" cy="4.5" r="1.5" fill="#1a1a1a"/></pattern>
    <linearGradient id="w-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="w-skymask"><rect width="1600" height="900" fill="url(#w-fade)"/></mask>
    <g id="w-cloud">
      <path d="M8 74 Q-6 52 16 40 Q14 14 44 14 Q56 -6 84 4 Q104 -12 128 6 Q156 0 162 26 Q190 28 188 54 Q204 72 184 82 Q100 92 8 74 Z" class="cloud"/>
      <path d="M44 40 q10 -14 26 -8 M108 30 q14 -12 28 0 M150 56 q12 -6 20 4" class="cloud__line"/>
      <path d="M20 70 Q100 84 182 74" class="cloud__shade"/>
    </g>
    <path id="w-rocketpath" d="M1720 330 C 1400 120, 980 60, 760 150 S 300 290, -260 110"/>
  </defs>
  <rect width="1600" height="900" fill="url(#w-sky)"/>
  <rect width="1600" height="900" fill="url(#w-dots)" mask="url(#w-skymask)" class="sky-tone"/>

  {{- /* estrellas y luna (edición nocturna) */}}
  <g class="stars">
    {{- range slice (slice 90 70) (slice 210 160) (slice 330 50) (slice 470 120) (slice 610 40) (slice 720 210) (slice 880 90) (slice 990 30) (slice 1100 150) (slice 1230 60) (slice 1330 200) (slice 1560 240) (slice 60 300) (slice 420 260) (slice 1180 270) }}
    <path d="M{{ index . 0 }} {{ sub (index . 1) 8 }} l2.2 5.8 l5.8 2.2 l-5.8 2.2 l-2.2 5.8 l-2.2 -5.8 l-5.8 -2.2 l5.8 -2.2 Z" class="star" style="--t:{{ mod (index . 0) 7 }}"/>
    {{- end }}
  </g>

  <g class="sun" transform="translate(1455 118)">
    <g class="sun__rays">
      {{- range seq 0 20 340 }}
      <path d="M-9 -84 L0 -122 L9 -84 Z" transform="rotate({{ . }})" class="ray {{ if modBool . 40 }}ray--b{{ end }}"/>
      {{- end }}
    </g>
    <circle r="72" class="sun__disc"/>
    <circle r="72" fill="url(#w-dots)" class="sun__tone"/>
    <path d="M-44 -28 q14 -22 38 -26" class="sun__shine"/>
    <circle r="66" cx="30" cy="-24" class="moon-cut"/>
    <g class="moon-craters"><circle cx="-30" cy="18" r="9"/><circle cx="-8" cy="40" r="6"/><circle cx="-42" cy="-10" r="5"/></g>
  </g>

  <g class="clouds">
    <use href="#w-cloud" class="cl" style="--y:70px;--s:1.25;--dur:70s;--del:-12s"/>
    <use href="#w-cloud" class="cl" style="--y:200px;--s:.8;--dur:52s;--del:-40s"/>
    <use href="#w-cloud" class="cl" style="--y:30px;--s:.65;--dur:46s;--del:-5s"/>
    <use href="#w-cloud" class="cl" style="--y:280px;--s:1;--dur:84s;--del:-60s"/>
  </g>

  {{- /* globo aerostático */}}
  <g class="balloon" transform="translate(800 120)">
    <g class="balloon__bob">
      <path d="M0 -70 C 56 -70 64 -6 22 34 L-22 34 C -64 -6 -56 -70 0 -70 Z" class="balloon__env"/>
      <path d="M0 -70 C 22 -50 22 10 8 34 M0 -70 C -22 -50 -22 10 -8 34" class="balloon__seam"/>
      <path d="M-46 -26 Q0 -12 46 -26" class="balloon__band"/>
      <text x="0" y="-14" text-anchor="middle" class="balloon__txt">MCP</text>
      <path d="M-20 36 L-12 58 M20 36 L12 58" class="ink-thin"/>
      <rect x="-15" y="56" width="30" height="22" rx="3" class="balloon__basket"/>
      <path d="M-15 63 h30" class="ink-thin"/>
    </g>
  </g>

  <g class="birds">
    <path d="M0 0 q10 -10 20 0 q10 -10 20 0" class="bird"/>
    <path d="M44 -22 q8 -8 16 0 q8 -8 16 0" class="bird bird--2"/>
    <path d="M30 26 q7 -7 14 0 q7 -7 14 0" class="bird bird--3"/>
  </g>

  {{- /* cohete con pancarta */}}
  <g class="rocket">
    <g transform="scale(1.1)">
      <path d="M-170 -4 L-74 -16 L-74 20 L-170 8 Z" class="banner"/>
      <path d="M-170 -4 l-10 -6 l4 12 l-4 12 l10 -6" class="banner"/>
      <text x="-122" y="8" text-anchor="middle" class="banner__txt">PANDO</text>
      <path d="M-74 2 L-34 2" class="ink"/>
      <path d="M-34 -18 L28 -18 Q64 0 28 18 L-34 18 Z" class="rocket__body"/>
      <path d="M-6 -18 L-6 18" class="ink-thin"/>
      <circle cx="14" r="8" class="rocket__win"/>
      <path d="M-34 -18 L-50 -34 L-22 -18 Z M-34 18 L-50 34 L-22 18 Z" class="rocket__fin"/>
      <path d="M-34 -9 L-66 0 L-34 9 Z" class="rocket__fire"/>
    </g>
    <animateMotion dur="26s" repeatCount="indefinite" rotate="auto-reverse"><mpath href="#w-rocketpath"/></animateMotion>
  </g>
</svg>

{{- /* ── 2 · MONTAÑAS ──────────────────────────────────────── */}}
<svg class="layer layer--far" {{ $vb }} aria-hidden="true" style="--d:10">
  <defs>
    <pattern id="w-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><path d="M0 4 H8" stroke="#1a1a1a" stroke-width="1.6"/></pattern>
  </defs>
  <path d="M-40 560 L90 400 L170 470 L300 300 L420 440 L520 360 L640 520 L-40 560 Z" class="mount mount--b"/>
  <path d="M300 300 L420 440 L520 360 L560 410 L460 520 L300 520 Z" fill="url(#w-hatch)" opacity=".22"/>
  <path d="M262 348 L300 300 L344 352 L326 344 L312 360 L296 342 L280 356 Z" class="snow"/>
  <path d="M520 560 L700 380 L800 470 L930 330 L1060 470 L1180 390 L1330 520 L1450 360 L1640 520 L1640 580 L520 580 Z" class="mount"/>
  <path d="M930 330 L1060 470 L1100 440 L1180 390 L1260 460 L1100 560 L930 560 Z" fill="url(#w-hatch)" opacity=".22"/>
  <path d="M892 374 L930 330 L972 378 L952 370 L940 388 L924 370 L908 384 Z" class="snow"/>
  <path d="M1412 404 L1450 360 L1494 410 L1474 400 L1460 418 L1446 400 L1428 414 Z" class="snow"/>
  <path d="M664 416 L700 380 L736 418 L718 410 L706 424 L690 410 Z" class="snow"/>
</svg>

{{- /* ── 3 · COLINAS, ÁRBOLES Y PUEBLO ─────────────────────── */}}
<svg class="layer layer--mid" {{ $vb }} aria-hidden="true" style="--d:18">
  <defs>
    <g id="w-tree">
      <rect x="-7" y="10" width="14" height="52" rx="3" class="trunk"/>
      <path d="M-7 34 q-14 -8 -18 -20 M7 28 q12 -6 16 -18" class="ink-thin"/>
      <circle r="40" class="tree"/>
      <path d="M-20 -20 a28 28 0 0 1 26 -12" class="tree__shine"/>
      <path d="M10 34 a40 40 0 0 0 28 -26 a34 34 0 0 1 -28 26 Z" class="tree__shade"/>
    </g>
    <g id="w-pine">
      <rect x="-5" y="40" width="10" height="24" class="trunk"/>
      <path d="M0 -50 L30 0 L14 0 L38 40 L-38 40 L-14 0 L-30 0 Z" class="pine"/>
      <path d="M0 -50 L30 0 L14 0 L38 40 L10 40 Z" class="tree__shade"/>
    </g>
  </defs>
  <path d="M-40 600 Q160 480 420 540 T 900 520 T 1300 500 T 1640 520 L1640 700 L-40 700 Z" class="hill hill--b"/>
  <path d="M-40 640 Q260 560 560 610 T 1160 590 T 1640 600 L1640 760 L-40 760 Z" class="hill"/>
  <path d="M120 600 q60 -10 110 6 M760 600 q50 -12 100 4 M1320 590 q60 -10 120 4" class="hill__line"/>

  {{- range slice (slice 60 520 .8 "t") (slice 150 545 .62 "p") (slice 470 528 .7 "t") (slice 1120 512 .66 "p") (slice 1220 500 .9 "t") (slice 1560 520 .75 "t") (slice 980 520 .55 "t") }}
  <use href="{{ if eq (index . 3) "p" }}#w-pine{{ else }}#w-tree{{ end }}" transform="translate({{ index . 0 }} {{ index . 1 }}) scale({{ index . 2 }})" class="sway" style="--sd:{{ mod (index . 0) 5 }}"/>
  {{- end }}

  {{- /* casa seta */}}
  <g transform="translate(250 520)" class="house">
    <rect x="-34" y="0" width="68" height="64" rx="14" class="wall"/>
    <path d="M-70 8 Q-66 -66 0 -70 Q66 -66 70 8 Q0 26 -70 8 Z" class="roof roof--red"/>
    <circle cx="-30" cy="-30" r="9" class="dot-w"/><circle cx="12" cy="-48" r="7" class="dot-w"/><circle cx="36" cy="-16" r="10" class="dot-w"/><circle cx="-4" cy="-10" r="6" class="dot-w"/>
    <circle cx="-14" cy="30" r="10" class="win"/><path d="M-14 20 v20 M-24 30 h20" class="ink-thin"/>
    <path d="M10 64 v-30 a10 10 0 0 1 20 0 v30" class="door"/>
  </g>
  {{- /* casa cúpula */}}
  <g transform="translate(390 548)" class="house">
    <path d="M-50 40 v-30 a50 50 0 0 1 100 0 v30 Z" class="wall wall--w"/>
    <path d="M-50 14 h100" class="band"/>
    <circle cx="-20" cy="-8" r="8" class="win"/><circle cx="8" cy="-16" r="8" class="win"/>
    <rect x="18" y="16" width="18" height="24" rx="8" class="door"/>
    <path d="M0 -40 v-18" class="ink"/><circle cx="0" cy="-62" r="6" class="beacon"/>
  </g>
  {{- /* molino */}}
  <g transform="translate(1500 470)" class="house">
    <path d="M-22 70 L-14 -10 L14 -10 L22 70 Z" class="wall wall--y"/>
    <path d="M-20 -10 L0 -36 L20 -10 Z" class="roof roof--blue"/>
    <rect x="-7" y="40" width="14" height="30" rx="6" class="door"/>
    <g class="mill" transform="translate(0 -14)">
      {{- range slice 0 90 180 270 }}<path d="M0 0 L8 -66 L-6 -66 Z" transform="rotate({{ . }})" class="mill__blade"/>{{ end }}
      <circle r="6" class="ink-fill"/>
    </g>
  </g>
  {{- /* torre con bandera */}}
  <g transform="translate(1040 420)" class="house">
    <rect x="-22" y="20" width="44" height="120" class="wall wall--b"/>
    <path d="M-30 24 L0 -30 L30 24 Z" class="roof roof--blue"/>
    <circle cy="54" r="10" class="win"/>
    <path d="M0 -30 v-26" class="ink"/><path d="M0 -56 l26 8 l-26 8 Z" class="flag"/>
  </g>
</svg>

{{- /* ── 4 · EL LABORATORIO ────────────────────────────────── */}}
<svg class="layer layer--lab" {{ $vb }} aria-hidden="true" style="--d:26">
  <defs>
    <pattern id="w-bricks" width="28" height="16" patternUnits="userSpaceOnUse"><path d="M0 .5 H28 M0 8.5 H28 M14 .5 V8.5 M0 8.5 V16 M28 8.5 V16" stroke="#1a1a1a" stroke-width="1" opacity=".18"/></pattern>
    <pattern id="w-dots2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3.5" cy="3.5" r="1.1" fill="#1a1a1a"/></pattern>
  </defs>
  <g transform="translate(700 352) scale(.82)">
    {{- /* antena */}}
    <g>
      <path d="M318 96 V-30" class="ink ink--thick"/>
      <path d="M298 10 h40 M304 -10 h28" class="ink"/>
      <circle cx="318" cy="-40" r="10" class="beacon"/>
      <g class="waves">
        <path d="M296 -66 q22 -20 44 0" class="wave"/>
        <path d="M282 -86 q36 -32 72 0" class="wave w2"/>
        <path d="M268 -106 q50 -44 100 0" class="wave w3"/>
      </g>
    </g>
    {{- /* cúpula y telescopio */}}
    <path d="M30 140 a96 96 0 0 1 192 0 Z" class="dome"/>
    <path d="M30 140 a96 96 0 0 1 192 0 Z" fill="url(#w-dots2)" opacity=".18"/>
    <path d="M54 92 a80 80 0 0 1 60 -40" class="dome__shine"/>
    <path d="M112 50 L140 50 L146 140 L106 140 Z" class="dome__slit"/>
    <g class="scope"><rect x="112" y="6" width="26" height="78" rx="7" class="tube"/><rect x="108" y="4" width="34" height="14" rx="5" class="tube__ring"/></g>
    {{- /* edificio */}}
    <rect x="0" y="136" width="340" height="208" class="wall wall--lab"/>
    <rect x="0" y="136" width="340" height="208" fill="url(#w-bricks)"/>
    <path d="M-10 136 h360 v14 h-360 Z" class="eave"/>
    <rect x="70" y="160" width="200" height="44" rx="8" class="sign"/>
    <text x="170" y="193" text-anchor="middle" class="sign__txt">SEVIR LAB</text>
    <g class="lab-win"><rect x="22" y="222" width="80" height="62" rx="4" class="win win--lab"/><path d="M62 222 v62 M22 253 h80" class="ink-thin"/></g>
    <g class="lab-win"><rect x="238" y="222" width="80" height="62" rx="4" class="win win--lab"/><path d="M278 222 v62 M238 253 h80" class="ink-thin"/></g>
    <rect x="130" y="226" width="80" height="118" rx="6" class="door door--lab"/>
    <path d="M170 226 v118" class="ink-thin"/><circle cx="160" cy="290" r="3" class="knob"/><circle cx="180" cy="290" r="3" class="knob"/>
    <path d="M120 344 h100 l10 12 h-120 Z" class="step"/>
    {{- /* engranajes */}}
    <g transform="translate(-4 186)"><g class="gear gear--a">
      <circle r="30" class="gear__body"/>
      {{- range seq 0 45 315 }}<rect x="-7" y="-41" width="14" height="15" rx="2" transform="rotate({{ . }})" class="gear__body"/>{{ end }}
      <circle r="10" class="gear__hole"/>
    </g></g>
    <g transform="translate(38 156)"><g class="gear gear--b">
      <circle r="16" class="gear__body"/>
      {{- range seq 0 60 300 }}<rect x="-5" y="-23" width="10" height="9" rx="2" transform="rotate({{ . }})" class="gear__body"/>{{ end }}
      <circle r="6" class="gear__hole"/>
    </g></g>
    {{- /* chimenea con código */}}
    <rect x="252" y="78" width="38" height="60" class="chimney"/>
    <path d="M246 72 h50 v12 h-50 Z" class="chimney__cap"/>
    <g class="glyphs">
      {{- range $i, $g := slice "{ }" "</>" "fn" "go" "λ" "MCP" "rs" "=>" }}
      <text x="271" y="62" class="glyph" style="--i:{{ $i }}">{{ $g }}</text>
      {{- end }}
    </g>
    {{- /* tubo y matraz */}}
    <path d="M340 260 h30 q14 0 14 14 v70" class="pipe"/>
    <g transform="translate(384 344)">
      <path d="M-10 -40 v26 l-22 34 h64 l-22 -34 v-26 Z" class="flask"/>
      <path d="M-26 12 h52 l6 8 h-64 Z" class="flask__liquid"/>
      <circle cx="-4" cy="2" r="4" class="bubble-dot b1"/><circle cx="6" cy="-6" r="3" class="bubble-dot b2"/>
    </g>
    <text x="120" y="-40" class="sfx-kana" transform="rotate(-10 120 -40)">ピコピコ</text>
  </g>
</svg>

{{- /* ── 5 · SUELO ─────────────────────────────────────────── */}}
<svg class="layer layer--ground" {{ $vb }} aria-hidden="true" style="--d:36">
  <path d="M-40 720 Q300 650 700 690 T 1640 670 L1640 940 L-40 940 Z" class="grass"/>
  <path d="M-40 720 Q300 650 700 690 T 1640 670" class="grass__edge"/>
  {{- /* camino desde la puerta del laboratorio */}}
  <path d="M808 648 Q820 700 760 760 Q690 840 730 940 L950 940 Q880 850 920 770 Q960 700 872 648 Z" class="road"/>
  <path d="M838 680 q-10 40 -50 90 M790 840 q-6 40 20 90" class="road__line"/>
  {{- /* valla */}}
  <g class="fence">
    {{- range seq 20 46 400 }}<path d="M{{ . }} 742 v-46 l9 -10 l9 10 v46 Z" class="fence__post"/>{{ end }}
    <path d="M14 708 h402 M14 730 h402" class="fence__rail"/>
  </g>
  {{- /* hierba */}}
  <g class="blades">
    {{- range seq 10 52 1590 }}
    <path d="M{{ . }} {{ add 760 (mod (mul . 13) 110) }} l5 -14 l5 14 l5 -10 l4 10" class="blade"/>
    {{- end }}
  </g>
  {{- /* sombras de la familia */}}
  <g class="shadows">
    <ellipse cx="1130" cy="822" rx="90" ry="12"/><ellipse cx="1055" cy="832" rx="60" ry="10"/><ellipse cx="1178" cy="832" rx="58" ry="10"/><ellipse cx="1118" cy="830" rx="66" ry="10"/>
  </g>
  {{- range slice (slice 110 812 "f-r") (slice 230 870 "f-y") (slice 470 800 "f-p") (slice 920 860 "f-b") (slice 1430 820 "f-y") (slice 1520 878 "f-r") (slice 360 880 "f-b") (slice 1330 890 "f-p") }}
  <g transform="translate({{ index . 0 }} {{ index . 1 }})" class="flower {{ index . 2 }}">
    <path d="M0 6 v26" class="ink-thin"/><path d="M0 22 q-10 -2 -12 -10 q10 0 12 10" class="leaf"/>
    <g class="flower__head"><circle cx="-7" r="6.5"/><circle cx="7" r="6.5"/><circle cy="-7" r="6.5"/><circle cy="7" r="6.5"/><circle r="5" class="flower__c"/></g>
  </g>
  {{- end }}
  <g transform="translate(560 830)" class="rock"><path d="M-30 20 Q-34 -6 -8 -12 Q20 -18 30 6 Q34 20 -30 20 Z"/><path d="M-14 -4 q8 -6 16 -2" class="ink-thin"/></g>
</svg>
