{{- /* Cabecera de sección. dict "kicker" "title" "lead" "sfx" */ -}}
<header class="page-hero">
  <div class="speedlines" aria-hidden="true"></div>
  <div class="wrap page-hero__in">
    <p class="caption caption--kicker">{{ .kicker }}</p>
    <h1 class="page-hero__title">{{ .title }}</h1>
    {{- with .lead }}<p class="page-hero__lead">{{ . }}</p>{{ end }}
    {{- with .sfx }}<span class="page-hero__sfx" aria-hidden="true">{{ . }}</span>{{ end }}
  </div>
</header>
