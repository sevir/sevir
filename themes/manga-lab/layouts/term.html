{{ define "main" }}
<main id="content">
  {{ partial "page-hero.html" (dict "kicker" (T "tagged") "title" (printf "#%s" .Title) "sfx" "!?") }}
  <div class="paper">
    <section class="wrap section">
      <div class="posts">{{ range (.Paginate .Pages.ByDate.Reverse).Pages }}{{ partial "blog/card.html" . }}{{ end }}</div>
      {{ partial "pager.html" .Paginator }}
    </section>
  </div>
</main>
{{ end }}
