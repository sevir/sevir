{{ define "main" }}
<main id="content">
  {{ partial "page-hero.html" (dict "kicker" site.Title "title" (T "tags")) }}
  <div class="paper">
    <section class="wrap section">
      <p class="chips chips--tags chips--big">{{ range .Data.Terms.ByCount }}<a class="chip" href="{{ .Page.RelPermalink }}">#{{ .Page.Title }} <small>{{ .Count }}</small></a>{{ end }}</p>
    </section>
  </div>
</main>
{{ end }}
