{{ define "main" }}
<main id="content">
  {{ partial "page-hero.html" (dict "kicker" site.Title "title" .Title "lead" .Description) }}
  <div class="paper">
    <section class="wrap section">
      {{- with .Content }}<div class="panel prose">{{ . }}</div>{{ end }}
      <div class="posts">{{ range (.Paginate .RegularPages.ByDate.Reverse).Pages }}{{ partial "blog/card.html" . }}{{ end }}</div>
      {{ partial "pager.html" .Paginator }}
    </section>
  </div>
</main>
{{ end }}
